<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="popupTitle">ClipPiP</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <h1 class="title" data-i18n="popupTitle">ClipPiP</h1>
        <p class="subtitle" data-i18n="popupSubtitle"></p>
      </header>

      <button id="area-pin" class="primary" type="button" data-i18n="areaPinButton"></button>

      <p id="error" class="error" role="alert" hidden></p>

      <label class="setting">
        <input id="confirm-switch" type="checkbox" />
        <span data-i18n="confirmSwitchLabel"></span>
      </label>

      <section class="hint">
        <h2 class="hint-title" data-i18n="textPinHintTitle"></h2>
        <p class="hint-body" data-i18n-lines="textPinHintBody"></p>
      </section>

      <section class="hint">
        <h2 class="hint-title" data-i18n="shortcutHintTitle"></h2>
        <p class="hint-body" data-i18n-lines="shortcutHintBody"></p>
        <button id="open-shortcuts" class="link" type="button" data-i18n="shortcutAction"></button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
